<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Task Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📋 Tablero de Tareas</h1>

<h2>Agregar tarea</h2>

<input type="text" id="taskInput" placeholder="Escribe una tarea">
<button onclick="addTask()">Agregar</button>

<ul id="taskList"></ul>

<div class="board">
    <div class="column" id="pendiente">
        <h2>🟡 Pendiente</h2>
    </div>

    <div class="column" id="progreso">
        <h2>🔵 En Progreso</h2>
    </div>

    <div class="column" id="completado">
        <h2>🟢 Completado</h2>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
